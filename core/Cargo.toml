[package]
name = "cf-core"
version = "0.1.0"
edition = "2021"
description = "Geometrikjernen i Creature Forge"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
wasm-bindgen = "0.2"

# wasm-opt slås på igjen når vi måler størrelse og ytelse (milepæl 2).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
