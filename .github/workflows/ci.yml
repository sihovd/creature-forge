name: CI

on:
  pull_request:
  # Gjør det mulig å starte CI manuelt fra Actions-fanen.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Avbryt eldre kjøringer på samme gren når en ny commit kommer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust med wasm-mål
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Formatering og lint
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust-tester for geometrikjernen
        run: cargo test --workspace

      - name: Installer wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bygg kjernen og nettappen
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run build

      - name: Nettlesertester
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: web/dist

  # Publiserer appen på GitHub Pages når main oppdateres.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
